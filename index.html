<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mobile Calculator | Divine</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Inter", sans-serif;
    }

    .calc-button {
      min-height: 64px;
      border-radius: 20px;
      font-size: 1.25rem;
      font-weight: 600;
      transition: transform 0.12s ease, filter 0.12s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .calc-button:active {
      transform: scale(0.94);
      filter: brightness(1.08);
    }
  </style>
</head>

<body class="min-h-screen bg-[#f5f3ed] text-[#252a27]">

  <main class="mx-auto flex min-h-screen max-w-md flex-col justify-center px-4 py-8">

    <!-- Header -->
    <header class="mb-6 flex items-center justify-between">
      <div>
        <p class="text-xs font-semibold uppercase tracking-[0.25em] text-emerald-700">
          JavaScript Project
        </p>
        <h1 class="mt-2 text-2xl font-extrabold tracking-tight text-[#252a27]">
          Mobile Calculator
        </h1>
      </div>

      <div class="flex h-12 w-12 items-center justify-center rounded-2xl border border-[#e5e2d9] bg-white text-xl shadow-sm">
        ✳
      </div>
    </header>

    <!-- Calculator -->
    <section class="rounded-[32px] border border-[#e5e2d9] bg-white p-5 shadow-2xl shadow-[#26352b]/10">

      <!-- Display -->
      <div class="mb-5 flex min-h-36 flex-col items-end justify-end overflow-hidden rounded-2xl bg-[#f0efe9] px-4 py-5">
        <p
          id="expression-display"
          class="mb-3 min-h-5 max-w-full break-all text-right text-sm text-[#777d76]"
          aria-live="polite">
        </p>

        <p
          id="result-display"
          class="max-w-full break-all text-right text-4xl font-semibold tracking-tight text-[#252a27]"
          aria-live="polite">
          0
        </p>
      </div>

      <!-- Calculator Buttons -->
      <div id="calculator-buttons" class="grid grid-cols-4 gap-3">

        <!-- Utility buttons -->
        <button type="button" data-action="clear"
          class="calc-button bg-[#e8e7df] text-[#303731] hover:bg-[#dcded4]">
          AC
        </button>

        <button type="button" data-action="sign"
          class="calc-button bg-[#e8e7df] text-[#303731] hover:bg-[#dcded4]">
          +/−
        </button>

        <button type="button" data-action="percent"
          class="calc-button bg-[#e8e7df] text-[#303731] hover:bg-[#dcded4]">
          %
        </button>

        <button type="button" data-action="operator" data-operator="/"
          class="calc-button bg-[#176b45] text-white hover:bg-[#218457]">
          ÷
        </button>

        <!-- Number buttons -->
        <button type="button" data-number="7"
          class="calc-button bg-[#eeede6] text-[#252a27] hover:bg-[#dedfd5]">7</button>

        <button type="button" data-number="8"
          class="calc-button bg-[#eeede6] text-[#252a27] hover:bg-[#dedfd5]">8</button>

        <button type="button" data-number="9"
          class="calc-button bg-[#eeede6] text-[#252a27] hover:bg-[#dedfd5]">9</button>

        <button type="button" data-action="operator" data-operator="*"
          class="calc-button bg-[#176b45] text-white hover:bg-[#218457]">×</button>

        <button type="button" data-number="4"
          class="calc-button bg-[#eeede6] text-[#252a27] hover:bg-[#dedfd5]">4</button>

        <button type="button" data-number="5"
          class="calc-button bg-[#eeede6] text-[#252a27] hover:bg-[#dedfd5]">5</button>

        <button type="button" data-number="6"
          class="calc-button bg-[#eeede6] text-[#252a27] hover:bg-[#dedfd5]">6</button>

        <button type="button" data-action="operator" data-operator="-"
          class="calc-button bg-[#176b45] text-white hover:bg-[#218457]">−</button>

        <button type="button" data-number="1"
          class="calc-button bg-[#eeede6] text-[#252a27] hover:bg-[#dedfd5]">1</button>

        <button type="button" data-number="2"
          class="calc-button bg-[#eeede6] text-[#252a27] hover:bg-[#dedfd5]">2</button>

        <button type="button" data-number="3"
          class="calc-button bg-[#eeede6] text-[#252a27] hover:bg-[#dedfd5]">3</button>

        <button type="button" data-action="operator" data-operator="+"
          class="calc-button bg-[#176b45] text-white hover:bg-[#218457]">+</button>

        <!-- Bottom row -->
        <button type="button" data-action="delete"
          class="calc-button bg-[#e8e7df] text-sm text-[#303731] hover:bg-[#dcded4]">
          DEL
        </button>

        <button type="button" data-number="0"
          class="calc-button bg-[#eeede6] text-[#252a27] hover:bg-[#dedfd5]">0</button>

        <button type="button" data-action="decimal"
          class="calc-button bg-[#eeede6] text-[#252a27] hover:bg-[#dedfd5]">.</button>

        <button type="button" data-action="equals"
          class="calc-button bg-[#a8d5b5] text-lg text-[#153b28] hover:bg-[#8fc8a0]">=</button>

      </div>

      <p id="calculator-message"
        class="mt-4 min-h-4 text-center text-xs text-[#85877f]">
        Ready for your calculation
      </p>

    </section>

    <!-- Footer -->
    <footer class="mt-5 text-center text-xs text-[#85877f]">
      Built with HTML, Tailwind CSS and JavaScript
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
